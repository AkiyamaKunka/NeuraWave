name: CI

on:
  push:
  pull_request:

jobs:
  build-and-autotest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Strict concurrency check (Swift 6 rules, warnings are errors)
        run: swift build --build-path .build-strict -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Unit tests (render path, session logic, settings, timing)
        run: swift test

      - name: Self-test scenarios (parallel; smoke, stop/restart, stress, pause/resume, device change, program, timer)
        run: swift build && bash scripts/quick-tests.sh

  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build NeuraWaveCore for iOS
        run: xcodebuild -scheme NeuraWaveCore -destination 'generic/platform=iOS Simulator' build -quiet

      # The package-wide scheme would also build the macOS app, so a shared
      # scheme (.swiftpm/xcode) runs just the core tests.
      - name: Core unit tests on an iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          set -o pipefail
          xcodebuild test -scheme NeuraWaveCoreTests -destination "id=$DEVICE_ID" | tee ios-tests.log | grep -E "Test Case|Executed|error:"
          # A scheme that silently matched no tests would also "succeed".
          grep -qE "Executed [1-9][0-9]* tests?, with 0 failures" ios-tests.log

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: brew install xcodegen && cd Apps/iOS && xcodegen

      # Unsigned: proves the app compiles for simulator and device.
      - name: Build the iPhone app
        run: |
          cd Apps/iOS
          xcodebuild -project NeuraWave.xcodeproj -scheme NeuraWave -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO -quiet
          xcodebuild -project NeuraWave.xcodeproj -scheme NeuraWave -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO -quiet
