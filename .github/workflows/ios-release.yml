# iPhone release lane: signed build -> App Store Connect (TestFlight), then
# optionally the App Store listing and an App Review submission.
# Owner's steps and the one-time website chores: Apps/iOS/RELEASING-iOS.md.
#
# TRIGGERS
#   "Run workflow" (workflow_dispatch)  -> upload to TestFlight; tick the boxes to
#                                          also push the listing and submit for review
#   tag push ios-v<x.y>                 -> upload + listing + submit (x.y must equal
#                                          MARKETING_VERSION in Apps/iOS/project.yml)
#   tag push ios-beta-<anything>        -> upload + listing, no submission. Works before
#                                          this file reaches the default branch, which
#                                          "Run workflow" needs.
#   Never on pull_request: the repo is public and this job holds the API key.
#
# SECRETS (repo Settings -> Secrets and variables -> Actions)
#   ASC_KEY_ID             App Store Connect team API key ID (Admin role: cloud signing
#                          creates the distribution certificate and profile itself)
#   ASC_ISSUER_ID          issuer ID shown above the key list (a UUID)
#   ASC_API_KEY_P8_BASE64  the AuthKey_<KEYID>.p8 file, base64
# Missing secrets skip the run with a warning; nothing fails.
#
# VARIABLES (same page, Variables tab; only needed to submit for review)
#   ASC_CONTACT_FIRST_NAME, ASC_CONTACT_LAST_NAME, ASC_CONTACT_EMAIL, ASC_CONTACT_PHONE
#
# BUILD NUMBER = BUILD_NUMBER_OFFSET + run_number. Build 1 was archived by hand on the
# Mac, and App Store Connect refuses a number it has seen. Never lower the offset.
name: iOS release

on:
  push:
    tags:
      - 'ios-v*'
      - 'ios-beta-*'
  workflow_dispatch:
    inputs:
      listing:
        description: Also push the App Store listing (text, screenshots, price, age rating) and attach the build
        type: boolean
        default: true
      submit:
        description: Also submit that version to App Review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  TEAM_ID: WLQB3YB22M
  BUILD_NUMBER_OFFSET: 10

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iPhone app -> App Store Connect
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are configured
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_API_KEY_P8_BASE64" ]] || missing+=(ASC_API_KEY_P8_BASE64)
          if (( ${#missing[@]} )); then
            echo "::warning::Skipping the iOS release: missing secret(s) ${missing[*]}. See Apps/iOS/RELEASING-iOS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan version and build number
        if: steps.secrets.outputs.ready == 'true'
        id: plan
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' Apps/iOS/project.yml | head -1)
          [[ -n "$version" ]] || { echo "::error::MARKETING_VERSION not found in Apps/iOS/project.yml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            tag=${GITHUB_REF#refs/tags/ios-v}
            [[ "$tag" == "$version" ]] || { echo "::error::tag says $tag but project.yml says $version"; exit 1; }
            listing=true; submit=true
          elif [[ "$GITHUB_REF" == refs/tags/ios-beta-* ]]; then
            listing=true; submit=false
          else
            listing=${{ inputs.listing }}; submit=${{ inputs.submit }}
          fi
          number=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          {
            echo "version=$version"; echo "number=$number"
            echo "listing=$listing"; echo "submit=$submit"
          } >> "$GITHUB_OUTPUT"
          echo "## NeuraWave iOS $version ($number): listing=$listing, submit=$submit" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen && cd Apps/iOS && xcodegen

      - name: Archive (cloud signing)
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Apps/iOS/NeuraWaveiOS.xcodeproj -scheme NeuraWaveiOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NeuraWave.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.plan.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.plan.outputs.number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NeuraWave.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: TestFlight notes, listing, submission
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ steps.plan.outputs.version }}
          ASC_CONTACT_FIRST_NAME: ${{ vars.ASC_CONTACT_FIRST_NAME }}
          ASC_CONTACT_LAST_NAME: ${{ vars.ASC_CONTACT_LAST_NAME }}
          ASC_CONTACT_EMAIL: ${{ vars.ASC_CONTACT_EMAIL }}
          ASC_CONTACT_PHONE: ${{ vars.ASC_CONTACT_PHONE }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]' requests \
            || python3 -m pip install --quiet 'pyjwt[crypto]' requests
          n=${{ steps.plan.outputs.number }}
          python3 scripts/asc.py testflight "$n"
          if [[ "${{ steps.plan.outputs.listing }}" == true || "${{ steps.plan.outputs.submit }}" == true ]]; then
            python3 scripts/asc.py listing "$n"
          fi
          if [[ "${{ steps.plan.outputs.submit }}" == true ]]; then
            python3 scripts/asc.py submit
          fi

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
