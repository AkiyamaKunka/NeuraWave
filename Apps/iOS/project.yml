# Xcode project for the iPhone app, generated with XcodeGen:
#   brew install xcodegen && cd Apps/iOS && xcodegen
# The generated NeuraWave.xcodeproj is not committed.
name: NeuraWave
options:
  bundleIdPrefix: com.akiyamakunka
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NeuraWave:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or pass DEVELOPMENT_TEAM=... to xcodebuild.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NeuraWave:
    type: application
    platform: iOS
    sources:
      - path: NeuraWave
    dependencies:
      - package: NeuraWave
        product: NeuraWaveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiyamakunka.NeuraWave
        PRODUCT_NAME: NeuraWave
        INFOPLIST_FILE: NeuraWave/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
